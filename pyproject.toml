[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-contract-signing"
version = "0.1.0"
description = "Sign media streaming contracts and gate creator delivery on completion"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["contract_service", "run_example", "signing_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
